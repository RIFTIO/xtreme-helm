apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-controller
  namespace: {{  .Values.global.namespace.name }}
  labels:
    strimzi.io/cluster: {{ include "kafka.prefix" . }}
  annotations:
     strimzi.io/next-node-ids: "[1]"
spec:
  replicas: 1
  roles:
    - controller
  resources:
      requests:
        memory: 2Gi
        cpu: "2"
      limits:
        memory: 4Gi
        cpu: "4"
  storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 5Gi
          {{- if .Values.kafkaStorage.storageClassName }}
          class: {{ .Values.kafkaStorage.storageClassName }}
          {{- end }}
          kraftMetadata: shared
          deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-broker
  namespace: {{  .Values.global.namespace.name }}
  labels:
    strimzi.io/cluster: {{ include "kafka.prefix" . }}
  annotations:
     strimzi.io/next-node-ids: "[0]"
spec:
  replicas: 1
  roles:
    - broker
  resources:
      requests:
        memory: 2Gi
        cpu: "2"
      limits:
        memory: 4Gi
        cpu: "4"
  storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 5Gi
          {{- if .Values.kafkaStorage.storageClassName }}
          class: {{ .Values.kafkaStorage.storageClassName }}
          {{- end }}
          kraftMetadata: shared
          deleteClaim: false

