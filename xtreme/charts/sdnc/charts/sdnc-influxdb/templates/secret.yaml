{{- if not (.Values.adminUser.existingSecret) -}}
{{- $ns := include "sdnc.namespace" . }}
{{- $existingSecretData := dict }}
{{- $existingScrt := (lookup "v1" "Secret" $ns .Values.global.inflxdb.secretName) }}
{{- if $existingScrt }}
{{-   $existingSecretData = ($existingScrt.data | default dict) }}
{{- end }}

{{- $prevToken := "" }}
{{- if hasKey $existingSecretData "admin-token" }}
{{-   $prevToken = index $existingSecretData "admin-token" | b64dec }}
{{- end }}
{{- $prevPassword := "" }}
{{- if hasKey $existingSecretData "admin-password" }}
{{-   $prevPassword = index $existingSecretData "admin-password" | b64dec }}
{{- end }}

{{- $token := .Values.adminUser.token | default $prevToken | default (randAlphaNum 32) }}
{{- $password := .Values.global.inflxdb.password | default .Values.adminUser.password | default $prevPassword | default (randAlphaNum 32) }}

apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "sdnc-influxdb.labels" . | nindent 4 }}
  name: {{ .Values.global.inflxdb.secretName }}
  namespace: {{ $ns }}
data:
  admin-token: {{ $token | b64enc | quote }}
  admin-password: {{ $password | b64enc | quote }}
{{- end -}}
